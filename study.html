:root{--bg:#06070d;--s1:#0c0e1b;--s2:#12152b;--s3:#1b1f40;--line:rgba(143,150,255,.15);--line2:rgba(143,150,255,.32);--ink:#eef0ff;--dim:#8a90bd;--violet:#8f7bff;--cyan:#2ef2d6;--pink:#ff3f8e;--amber:#ffb938;--sky:#4fb7ff;--rail:240px;--disp:"Avenir Next Condensed","DIN Condensed","Arial Narrow","PingFang SC","Hiragino Sans GB",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}

body{font-family:var(--ui);color:var(--ink);min-height:100vh;background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body:after{content:"";position:fixed;inset:0;z-index:90;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#sky{position:fixed;inset:0;z-index:-2;overflow:hidden;background:linear-gradient(rgba(143,150,255,.05) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(143,150,255,.05) 1px,transparent 1px) 0 0/44px 44px;-webkit-mask-image:radial-gradient(ellipse at 60% 20%,#000 20%,transparent 78%);mask-image:radial-gradient(ellipse at 60% 20%,#000 20%,transparent 78%)}
#sky:before,#sky:after{content:"";position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 26s ease-in-out infinite alternate}
#sky:before{width:560px;height:560px;left:18%;top:-220px;background:#5a3dff}
#sky:after{width:480px;height:480px;right:-120px;top:30%;background:#00b8a6;opacity:.28;animation-duration:34s}
@keyframes drift{to{transform:translate(90px,70px) scale(1.15)}}
#petals{display:none}
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:800;letter-spacing:.005em}
button{font-family:inherit}
header#top{position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:20;display:flex;flex-direction:column;gap:26px;padding:24px 16px 18px;background:linear-gradient(180deg,rgba(12,14,27,.92),rgba(6,7,13,.92));backdrop-filter:blur(12px);border-right:1px solid var(--line)}
.brand{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}
.brand b{font-family:var(--disp);font-size:24px;line-height:1.05}
.brand small{grid-column:2;color:var(--dim);font-family:var(--mono);font-size:11px}
.logo{grid-row:span 2;width:40px;height:40px;border-radius:11px;position:relative;background:linear-gradient(145deg,#1d2150,#0c0e1b);box-shadow:inset 0 0 0 1px var(--line2),0 0 24px rgba(143,123,255,.35);font-size:0}
.logo:before{content:"";position:absolute;left:9px;bottom:9px;width:5px;height:10px;border-radius:2px;background:var(--pink);box-shadow:8px -5px 0 var(--amber),16px -10px 0 var(--cyan)}
nav{display:flex;flex-direction:column;gap:3px;flex:1}
nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:11px 13px;border-radius:10px;font-size:15px;font-weight:600;color:var(--dim);cursor:pointer;text-align:left;white-space:nowrap;transition:background .15s,color .15s}
nav button svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{background:var(--s2);color:var(--ink)}
nav button.on{background:linear-gradient(90deg,rgba(143,123,255,.28),rgba(143,123,255,.06));color:#fff;box-shadow:inset 2px 0 0 var(--violet)}
nav button.on svg{stroke:var(--cyan)}
nav b.n{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--pink);color:#fff;border-radius:99px;padding:1px 7px}
.hud{padding:13px 14px;border-radius:14px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--dim)}
.lv{font-family:var(--disp);font-size:26px;color:var(--amber);line-height:1}
.xpbar{height:6px;border-radius:3px;background:#2a2f66;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));transition:width .6s}
.hud .xp{grid-column:1/-1}
main{max-width:1120px;margin:0 auto 0 var(--rail);padding:34px 38px 100px}
.card{position:relative;background:linear-gradient(180deg,rgba(24,28,62,.55),rgba(12,14,27,.8));border-radius:16px;padding:22px;box-shadow:inset 0 0 0 1px var(--line),0 18px 40px -22px rgba(0,0,0,.8)}
.card:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(140deg,rgba(255,255,255,.22),transparent 38%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.btn{position:relative;border:0;font-size:15px;font-weight:700;cursor:pointer;padding:12px 22px;border-radius:11px;color:#fff;background:linear-gradient(180deg,#9c8bff,#7561f0);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 22px -6px rgba(117,97,240,.7);transition:transform .12s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.pink{background:linear-gradient(180deg,#ff6aa8,#ee2d7a);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 22px -6px rgba(255,63,142,.7)}
.btn.gold{color:#2a1b00;background:linear-gradient(180deg,#ffd37a,#ffb02e);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 8px 22px -6px rgba(255,185,56,.65)}
.btn.ghost{color:var(--ink);background:var(--s2);box-shadow:inset 0 0 0 1px var(--line2)}
.btn[disabled]{opacity:.38;cursor:not-allowed;filter:none;transform:none}
:is(.btn,.opt,.chip,nav button,.dot,.lesson,.pk,.star,.flag,.seg button):focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;align-items:center}
.sp{flex:1}
.mini{font-size:12px;color:var(--dim)}
.sec{margin:38px 0 14px;font-size:28px;display:flex;align-items:baseline;gap:14px}
.sec small{font-family:var(--mono);font-size:12px;color:var(--dim);font-weight:400}
.sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
/* ---------- home ---------- */
.stage{padding:0;overflow:hidden;background:radial-gradient(600px 300px at 80% 0,rgba(143,123,255,.28),transparent 70%),linear-gradient(180deg,#0f1230,#090b1a)}
.stage .top{padding:30px 34px 6px}
.stage h1{font-size:clamp(34px,4.6vw,60px);line-height:1.02}
.stage h1 em{font-style:normal;background:linear-gradient(90deg,var(--cyan),var(--violet) 60%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.stage p{margin:12px 0 0;color:var(--dim);max-width:52ch;line-height:1.75}
.scope{margin:22px 34px 0;border-radius:14px;background:#04050c;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.scope .bar{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs2{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.tabs2 button{border:0;background:transparent;color:var(--dim);font-size:13px;font-weight:600;padding:5px 11px;border-radius:7px;cursor:pointer}
.tabs2 button.on{background:var(--s3);color:var(--cyan)}
.ctl{display:flex;gap:4px}
.ctl button{width:30px;height:28px;border:0;border-radius:7px;background:var(--s2);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.ctl button:hover{background:var(--s3)}
.ctl svg{width:14px;height:14px;fill:currentColor}
.plot{position:relative;height:190px;display:flex;align-items:flex-end;gap:8px;padding:28px 18px 26px;background:linear-gradient(rgba(143,150,255,.06) 1px,transparent 1px) 0 0/100% 38px}
.plot i{position:relative;flex:1;border-radius:5px 5px 0 0;background:linear-gradient(180deg,#a090ff,#5844d8);transition:height .28s cubic-bezier(.3,1.4,.5,1),background .15s,box-shadow .15s}
.plot i b{position:absolute;top:-20px;left:0;right:0;text-align:center;font:600 12px var(--mono);color:var(--dim)}
.plot i u{position:absolute;bottom:-21px;left:0;right:0;text-align:center;text-decoration:none;font:700 11px var(--mono);color:var(--amber);white-space:nowrap}
.plot i.cmp{background:linear-gradient(180deg,#ffd37a,#e79a14);box-shadow:0 0 26px rgba(255,185,56,.55)}
.plot i.swp{background:linear-gradient(180deg,#ff7db3,#e01f6b);box-shadow:0 0 26px rgba(255,63,142,.6)}
.plot i.ok{background:linear-gradient(180deg,#6bffe9,#0fb9a1);box-shadow:0 0 18px rgba(46,242,214,.35)}
.plot i.dim{opacity:.3}
.plot i.hit{background:linear-gradient(180deg,#6bffe9,#0fb9a1);box-shadow:0 0 28px rgba(46,242,214,.7)}
.readout{display:flex;gap:22px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);font:12px var(--mono);color:var(--dim)}
.readout b{color:var(--amber);font-weight:700}
.readout .say{margin-left:auto;color:var(--ink)}
.stage .row{padding:0 34px 28px;margin-top:22px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px}
.kpi{padding:18px 20px}
.kpi b{display:block;font-family:var(--disp);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{display:block;margin-top:6px;color:var(--dim);font-size:13px}
.kpi b i{font-style:normal;font-size:20px;color:var(--dim)}
/* ---------- level map ---------- */
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.lesson{cursor:pointer;padding:0;overflow:hidden;transition:transform .2s,box-shadow .2s;border:0;text-align:left;color:inherit;font:inherit}
.lesson:hover{transform:translateY(-5px);box-shadow:inset 0 0 0 1px var(--c),0 22px 44px -18px var(--c)}
.lesson .art{height:96px;position:relative;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 38%,#0c0e1b),#0c0e1b 80%);overflow:hidden}
.lesson .art svg{position:absolute;left:8px;top:0;width:min(64%,170px);height:100%;stroke:var(--c);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.lesson .art .id{position:absolute;right:14px;bottom:8px;font-family:var(--disp);font-size:38px;line-height:1;color:var(--c);opacity:.9}
.lesson .body{padding:14px 16px 16px}
.lesson h3{font-size:20px;margin:0 0 3px}
.lesson small{color:var(--dim);font-size:12px}
.lesson .meter{display:flex;gap:3px;margin-top:12px}
.lesson .meter i{flex:1;height:5px;border-radius:2px;background:var(--s3)}
.lesson .meter i.on{background:var(--c)}
.mantra{font-weight:600;line-height:1.7;padding:14px 18px;border-radius:12px;background:var(--s1);box-shadow:inset 3px 0 0 var(--amber),inset 0 0 0 1px var(--line);margin:10px 0}
.mantra .zh{display:block;color:var(--dim);font-weight:400;font-size:14px;margin-top:2px}
/* ---------- quiz ---------- */
.prompt{font-size:18px;line-height:1.8;white-space:pre-wrap}
.prompt code,.exp code,.mantra code{background:var(--s3);color:#ffd37a;border-radius:5px;padding:1px 6px;font:.88em var(--mono)}
.prompt pre > code{background:none;color:inherit;border-radius:0;padding:0;font:inherit}
pre{position:relative;background:#04050c;border-radius:12px;padding:16px 18px 16px;overflow-x:auto;font-size:14px;line-height:1.7;margin:14px 0;white-space:pre;box-shadow:inset 0 0 0 1px var(--line);font-family:var(--mono);color:#d7dcff;border-top:2px solid var(--violet)}
pre code{background:none;padding:0;color:inherit;font:inherit}
.k-kw{color:#ff7ab8}.k-fn{color:#6fd0ff}.k-num{color:#ffc46b}.k-str{color:#7bf0c8}.k-cm{color:#5d6592;font-style:italic}.k-bi{color:#b9a8ff}
.opts{display:grid;gap:10px;margin-top:18px}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.kbd{font:11px var(--mono);color:var(--dim);margin-left:10px}
.kbd kbd{background:var(--s3);border-radius:4px;padding:1px 6px;color:var(--ink)}
#toast{position:fixed;right:26px;bottom:28px;transform:translateY(24px);opacity:0;z-index:95;padding:11px 18px;border-radius:11px;font:700 13px var(--mono);color:#022a25;background:var(--cyan);box-shadow:0 14px 34px -8px rgba(46,242,214,.6);transition:.3s;pointer-events:none}
#toast.show{opacity:1;transform:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
.chip{border:0;background:var(--s1);border-radius:99px;padding:7px 15px;font-size:13px;font-weight:600;color:var(--dim);cursor:pointer;box-shadow:inset 0 0 0 1px var(--line);transition:.15s}
.chip:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.chip.on{background:var(--violet);color:#fff;box-shadow:0 6px 18px -6px var(--violet)}
/* ---------- exam ---------- */
/* ---------- mistakes ---------- */
.mistake{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:16px 18px}
.mistake .main{flex:1;min-width:240px}
.mistake .main .t{font-weight:600;line-height:1.6;white-space:pre-wrap;max-height:3.2em;overflow:hidden;margin-top:6px}
.mistake .row{margin:0}
.empty{text-align:center;padding:56px 20px;color:var(--dim)}
.empty svg{width:84px;margin-bottom:10px;stroke:var(--cyan);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* ---------- stats ---------- */
.radarbox{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:22px;align-items:center}
.radar{width:100%;height:auto}
.rowstat{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rowstat:last-child{border:0}
.rowstat .id{font:800 20px var(--disp)}
.rowstat .bar{height:7px;border-radius:4px;background:var(--s3);overflow:hidden}
.rowstat .bar i{display:block;height:100%;border-radius:4px}
.weak{color:var(--pink);font-size:11px;font-family:var(--mono)}
.badges{display:flex;gap:12px;flex-wrap:wrap}
.badge{width:116px;text-align:center;padding:16px 8px 12px;border-radius:14px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);font-size:12px;font-weight:600;color:var(--dim)}
.badge i{display:grid;place-items:center;width:44px;height:44px;margin:0 auto 8px;border-radius:12px;background:var(--s3);font-style:normal;font-size:22px;filter:grayscale(1);opacity:.4}
.badge.on{color:var(--ink);box-shadow:inset 0 0 0 1px var(--amber),0 0 26px -10px var(--amber)}
.badge.on i{filter:none;opacity:1;background:linear-gradient(135deg,#ffd37a,#ff9a3c);color:#2a1b00}
/* ---------- cards ---------- */
.sheet{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.sheet h2{font-size:34px;margin-bottom:2px}
.sheet ul{padding:0;margin:12px 0 0;list-style:none;display:grid;gap:10px}
.sheet li{position:relative;padding-left:22px;line-height:1.75}
.sheet li:before{content:"";position:absolute;left:2px;top:.72em;width:8px;height:8px;border-radius:2px;background:var(--cyan);transform:rotate(45deg)}
.sheet .trap li:before{background:var(--pink)}
.sheet .trap{box-shadow:inset 0 0 0 1px rgba(255,63,142,.4),0 18px 40px -22px rgba(255,63,142,.45)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media(max-width:1000px){.map{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.sheet,.radarbox{grid-template-columns:1fr}}
@media(max-width:820px){:root{--rail:0px}
header#top{position:sticky;width:auto;bottom:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;border-right:0;border-bottom:1px solid var(--line)}
.brand small{display:none}.brand b{font-size:20px}.logo{width:32px;height:32px}.logo:before{left:6px;bottom:7px}
nav{order:3;flex:1 1 100%;flex-direction:row;overflow-x:auto}
nav button{padding:8px 12px}nav button span{display:inline}
.hud{margin-left:auto;padding:6px 10px;grid-template-columns:auto 90px;grid-template-rows:auto}.hud .xp{display:none}
main{margin:0 auto;padding:20px 14px 90px}.stage .top{padding:22px 18px 4px}.scope{margin:18px 14px 0}.stage .row{padding:0 18px 22px}
.plot{height:150px;gap:5px;padding:26px 10px 24px}.map{grid-template-columns:1fr 1fr;gap:12px}.prompt{font-size:16px}.readout .say{margin-left:0}}
@media(max-width:480px){.map{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
/* ---------- guide ---------- */
.tip{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;margin-bottom:16px;border-radius:12px;background:linear-gradient(90deg,rgba(255,185,56,.16),rgba(255,185,56,.04));box-shadow:inset 3px 0 0 var(--amber),inset 0 0 0 1px var(--line)}
.tip .btn{padding:8px 16px;font-size:14px}
.flow{display:grid;gap:4px;margin-top:10px}
.step{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border:0}
.step .no{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;font:800 17px var(--disp);color:#04201d;background:var(--cyan)}
.step p,.gp{margin:4px 0 0;color:var(--dim);line-height:1.75;font-size:14.5px}
.step b{font-size:16px}
.keyrow{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);color:var(--dim)}
.keyrow:last-of-type{border:0}
kbd{font:700 12px var(--mono);background:var(--s3);color:var(--ink);border-radius:5px;padding:2px 8px;box-shadow:0 2px 0 #0a0c20}
@media(max-width:560px){.step{grid-template-columns:36px 1fr}.step .btn{grid-column:2;justify-self:start}.keyrow{grid-template-columns:1fr;gap:4px}}
/* ---------- 快速复习 ---------- */
.chip.fin:after{content:"✓";margin-left:6px;color:var(--cyan);font-weight:800}
.chip.on.fin:after{color:#fff}
.lessonbar{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.lessonbar .chip{flex:none;white-space:nowrap}
.rvhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 22px;margin-bottom:16px;box-shadow:inset 0 0 0 1px var(--line),inset 0 3px 0 var(--c)}
.rvhead h2{font-size:34px;color:var(--c);line-height:1.1}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{border:0;background:transparent;color:var(--dim);font-size:14px;font-weight:700;padding:7px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--violet);color:#fff}
.lead{font-size:17px;line-height:1.85;margin:6px 0 22px;max-width:62ch;color:var(--ink)}
.rvgrid{display:grid;grid-template-columns:190px minmax(0,1fr);gap:30px;align-items:start}
.toc{position:sticky;top:22px;display:grid;gap:2px;padding-left:14px;border-left:1px solid var(--line)}
.toc b{font-size:12px;color:var(--dim);margin-bottom:6px;font-family:var(--mono)}
.toc a{color:var(--dim);text-decoration:none;font-size:14px;line-height:1.5;padding:5px 0;margin-left:-15px;padding-left:13px;border-left:2px solid transparent;transition:color .15s}
.toc a:hover{color:var(--ink)}
.toc a.on{color:var(--cyan);border-left-color:var(--cyan)}
.rvbody{min-width:0;max-width:760px}
.rsec{margin-bottom:34px;scroll-margin-top:20px}

/* ================= 练习 / 模拟考 (v2) ================= */

.qcard:before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--lc,var(--violet)),transparent 70%)}

.qtags{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.qtopic{margin:14px 0 4px;font:600 12px var(--mono);color:var(--dim)}
.pill{display:inline-block;padding:3px 10px;border-radius:6px;font:700 11px var(--mono);color:#fff;background:var(--violet)}

.star,.flag{border:0;background:var(--s1);color:var(--dim);cursor:pointer;box-shadow:inset 0 0 0 1px var(--line);transition:.15s}
.star{width:38px;height:38px;border-radius:10px;display:grid;place-items:center}

.opts{display:grid;gap:11px;margin-top:20px}
.opt{position:relative;display:flex;gap:16px;align-items:center;text-align:left;width:100%;border:0;background:var(--s1);border-radius:14px;padding:14px 16px;font-size:16px;line-height:1.6;color:var(--ink);cursor:pointer;box-shadow:inset 0 0 0 1px var(--line);transition:transform .14s,box-shadow .14s,background .14s}
.opt .ot{flex:1;min-width:0}
.opt .k{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font:800 15px var(--mono);background:var(--s3);color:var(--violet);transition:.14s}
.opt:hover:not([disabled]):not(.sel){transform:translateX(5px);background:var(--s2);box-shadow:inset 0 0 0 1px var(--violet),0 0 26px -8px rgba(143,123,255,.7)}
.opt:hover:not([disabled]) .k{background:var(--violet);color:#fff}
.opt.sel{background:linear-gradient(90deg,rgba(143,123,255,.28),rgba(143,123,255,.08));box-shadow:inset 0 0 0 1.5px var(--violet)}
.opt.sel .k{background:var(--violet);color:#fff}
.opt.right{background:linear-gradient(90deg,rgba(46,242,214,.2),rgba(46,242,214,.04));box-shadow:inset 0 0 0 1.5px var(--cyan),0 0 32px -10px var(--cyan)}
.opt.right .k{background:var(--cyan);color:#022a25}
.opt.wrong{background:linear-gradient(90deg,rgba(255,63,142,.2),rgba(255,63,142,.04));box-shadow:inset 0 0 0 1.5px var(--pink),0 0 32px -10px var(--pink);animation:shake .38s}

.opt[disabled]:not(.right):not(.wrong){opacity:.45}
.exp{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--s1);box-shadow:inset 3px 0 0 var(--violet),inset 0 0 0 1px var(--line);line-height:1.85;white-space:pre-wrap;animation:rise .3s}

.xp{font:700 12px var(--mono);padding:2px 9px;border-radius:99px;background:rgba(46,242,214,.15);color:var(--cyan)}.xp.miss{background:rgba(255,63,142,.15);color:var(--pink)}
.qf{display:flex;align-items:center;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}

<script>window.QUESTIONS=[{"id": "l09-01", "lesson": "L01", "src": "l09", "prompt": "You play the guessing game: I think of a number between 1 and 1,000,000. You cut the range\nin half with each guess. In the worst case, about how many guesses do you need?", "options": ["1,000,000", "500,000", "20", "1,000"], "answer": 2, "exp": "Each guess throws away half of the numbers that are left. 1,000,000 halves down to 1\nin about 20 steps. Guessing one number at a time needs up to 1,000,000 guesses.\n\nRead again: L09 notes, section 3.", "zh": "每次将范围减半，约 20 次就能覆盖一百万种可能。", "topic": "算法与数据结构", "ref": "L09 notes, section 3.", "code": ""}, {"id": "l09-02", "lesson": "L01", "src": "l09", "prompt": "What is a **data structure**?", "options": ["A way of organising and storing data, so that we can use it efficiently", "Any program written in Python", "A list of steps that always finishes and is always correct", "The memory inside a computer"], "answer": 0, "exp": "C describes an **algorithm**, not a data structure. The two work together: halving\nonly works because the numbers are **in order**, and the order is the data structure.\n\nRead again: L09 notes, section 3.", "zh": "数据结构描述如何组织和储存数据，让操作更高效。", "topic": "算法与数据结构", "ref": "L09 notes, section 3.", "code": ""}, {"id": "l09-03", "lesson": "L02", "src": "l09", "prompt": "A function does `4n + 7` operations. What is its time complexity?", "options": ["`O(1)`", "`O(n)`", "`O(n²)`", "`O(log n)`"], "answer": 1, "exp": "Drop the constant factor `4`. Keep only the fastest-growing term: `n` grows, `7` does\nnot. So `4n + 7` is `O(n)`.\n\nRead again: L09 notes, section 4.", "zh": "忽略常数因子和常数项，4n + 7 的增长量级是 n。", "topic": "复杂度与 Big-O", "ref": "L09 notes, section 4.", "code": ""}, {"id": "l09-04", "lesson": "L02", "src": "l09", "prompt": "What is the time complexity of `three_each`?\n\n```python\ndef three_each(numbers):\n    count = 0\n    for number in numbers:\n        for i in range(3):\n            count = count + 1\n    return count\n```", "options": ["`O(n²)`", "`O(1)`", "`O(log n)`", "`O(n)`"], "answer": 3, "exp": "There is a loop inside a loop, but the inner loop always runs **3** times. Count the\nturns: `3 × n`. Drop the `3`: `O(n)`. A nested loop is `O(n²)` only when both loops grow\nwith `n`.\n\nRead again: L09 notes, section 4, \"Reading loops\".", "zh": "内层始终只有 3 次，总次数为 3n，因此是 O(n)。", "topic": "复杂度与 Big-O", "ref": "L09 notes, section 4, \"Reading loops\".", "code": ""}, {"id": "l09-05", "lesson": "L02", "src": "l09", "prompt": "A function has a loop over `n` items. **Inside** that loop, there is a halving loop: it\nhalves a number until it reaches 1. What is the time complexity of the function?", "options": ["`O(n log n)`", "`O(log n)`", "`O(n)`", "`O(n²)`"], "answer": 0, "exp": "The outer loop runs `n` times. Each time, the halving loop runs about `log n` times.\nA loop inside a loop **multiplies**: `n × log n`.\n\nRead again: L09 notes, section 4.", "zh": "外层 n 次，每次内层约 log n 次，相乘得到 O(n log n)。", "topic": "复杂度与 Big-O", "ref": "L09 notes, section 4.", "code": ""}, {"id": "l09-06", "lesson": "L02", "src": "l09", "prompt": "What is the **space** complexity of `total`? Space complexity is the **extra** memory the\nfunction uses.\n\n```python\ndef total(numbers):\n    result = 0\n    for number in numbers:\n        result = result + number\n    return result\n```", "options": ["`O(n)`", "`O(1)`", "`O(n²)`", "`O(log n)`"], "answer": 1, "exp": "The function makes one variable, `result`, whatever the size of the list. The input\nlist does not count: you were given it. The **time** is `O(n)`, but the **space** is `O(1)`.\n\nRead again: L09 notes, section 4.", "zh": "只需固定数量的变量，额外空间 O(1)；输入列表不计入额外空间。", "topic": "复杂度与 Big-O", "ref": "L09 notes, section 4.", "code": ""}, {"id": "l09-07", "lesson": "L02", "src": "l09", "prompt": "A function is `O(n)`. You run it on 1,000 items, then on 2,000 items. What happens to the\nwork?", "options": ["It stays the same", "It goes up by one step", "It is about two times larger", "It is about four times larger"], "answer": 2, "exp": "`O(n)`: double the input, and the work doubles. A is `O(1)`, B is `O(log n)`, and D\nis `O(n²)`.\n\nRead again: L09 notes, section 4, the table of the five runtimes.", "zh": "线性增长：输入加倍，工作量约加倍。", "topic": "复杂度与 Big-O", "ref": "L09 notes, section 4, the table of the five runtimes.", "code": ""}, {"id": "l09-08", "lesson": "L02", "src": "l09", "prompt": "Someone says: \"`contains` is `O(n)`.\" They do not say best, worst or average case. Which\ncase do they mean?", "options": ["The best case", "The average case", "All three cases at once", "The worst case"], "answer": 3, "exp": "When no case is named, we mean the **worst** case. It is a promise: the code is never\nslower than this.\n\nRead again: L09 notes, section 4.", "zh": "按本课程的约定，未说明情况时按最坏情况分析；Big-O 本身并不等于最坏情况。", "topic": "复杂度与 Big-O", "ref": "L09 notes, section 4.", "code": ""}, {"id": "l09-09", "lesson": "L03", "src": "l09", "prompt": "`items` is a list of `n` items. What does `items.pop(0)` cost?", "options": ["`O(1)`", "`O(log n)`", "`O(n)`", "`O(n²)`"], "answer": 2, "exp": "`pop(0)` removes the **first** item. Every other item then moves one place left. That\nis `n - 1` moves: `O(n)`. `pop()` with no position removes the last item, and nothing\nmoves: `O(1)`.\n\nRead again: L09 notes, section 5.", "zh": "删除头部需要把后面的元素前移，因此是 O(n)。", "topic": "列表与内存", "ref": "L09 notes, section 5.", "code": ""}, {"id": "l09-10", "lesson": "L03", "src": "l09", "prompt": "What does this code print?\n\n```python\nitems = [5, 6, 7, 8]\nprint(items[len(items) - 1])\n```", "options": ["`8`", "`7`", "An `IndexError`", "`4`"], "answer": 0, "exp": "`len(items)` is 4. The positions are 0, 1, 2 and 3, so the last position is\n`4 - 1 = 3`. `items[3]` is `8`. `items[4]` would be an `IndexError`.\n\nRead again: L09 notes, section 5.", "zh": "长度为 4，最后一个索引是 3，读到 8。", "topic": "列表与内存", "ref": "L09 notes, section 5.", "code": ""}, {"id": "l09-11", "lesson": "L03", "src": "l09", "prompt": "What does this code print?\n\n```python\na = [1, 2]\nb = a[:]\nb.append(3)\nprint(a)\n```", "options": ["`[1, 2, 3]`", "`None`", "`[3]`", "`[1, 2]`"], "answer": 3, "exp": "`a[:]` is a full slice: it makes a **copy**. So `b` is a different list, and\n`append` changes only `b`. With `b = a`, the answer would be `[1, 2, 3]`.\n\nRead again: L09 notes, section 5.", "zh": "切片创建了副本；修改 b 不会改变 a。", "topic": "列表与内存", "ref": "L09 notes, section 5.", "code": ""}, {"id": "l09-12", "lesson": "L03", "src": "l09", "prompt": "What does this code print?\n\n```python\nnumbers = [3, 3, 5]\nfor number in numbers:\n    if number == 3:\n        numbers.remove(number)\nprint(numbers)\n```", "options": ["`[5]`", "`[3, 5]`", "`[3, 3, 5]`", "An error"], "answer": 1, "exp": "The loop reads position 0: a `3`, so it removes it. The list is now `[3, 5]`. The\nsecond `3` moved to position 0, but the loop goes on to position 1 and reads `5`. So it\nnever sees the second `3`. Do not remove items from a list while you loop over it.\n\nRead again: L09 notes, section 5.", "zh": "删除第一个 3 后，第二个 3 移到已经走过的位置，循环会跳过它。", "topic": "列表与内存", "ref": "L09 notes, section 5.", "code": ""}, {"id": "l09-13", "lesson": "L04", "src": "l09", "prompt": "What happens when this code runs?\n\n```python\nword = \"Bat\"\nword[0] = \"C\"\nprint(word)\n```", "options": ["It prints `Cat`", "It prints `Bat`", "It gives a `TypeError`", "It prints `None`"], "answer": 2, "exp": "A string is **immutable**: it cannot change. You cannot change one character. Build\na new string instead: `word = \"C\" + word[1:]`.\n\nRead again: L09 notes, section 6.", "zh": "字符串不可变，不能对单个字符位置赋值。", "topic": "字符串", "ref": "L09 notes, section 6.", "code": ""}, {"id": "l09-14", "lesson": "L04", "src": "l09", "prompt": "You build a string of `n` characters. Which way costs `O(n)`?", "options": ["Put the characters in a list, then call `\"\".join(...)` once", "Add each character with `result = result + letter`", "Add each character at the front of a list with `insert(0, letter)`", "Cut the first character off with `text = text[1:]` on each turn"], "answer": 0, "exp": "`join` copies each character once: `O(n)`. B copies the whole string on every `+`,\nand C and D move or copy everything on every turn: all three are `O(n²)`.\n\nRead again: L09 notes, section 6.", "zh": "按课程的复制成本模型，收集字符后一次 join 是线性的；其余方案反复移动或复制已有内容。", "topic": "字符串", "ref": "L09 notes, section 6.", "code": ""}, {"id": "l09-15", "lesson": "L04", "src": "l09", "prompt": "What does this code print?\n\n```python\nwords = \"I like green tea\".split()\nprint(len(words))\n```", "options": ["`16`", "`1`", "`3`", "`4`"], "answer": 3, "exp": "`split()` cuts the string at each space and gives back a **list** of words:\n`[\"I\", \"like\", \"green\", \"tea\"]`. The list holds 4 words. 16 is the number of characters in\nthe string.\n\nRead again: L09 notes, section 6.", "zh": "split 得到四个单词，len 计算列表元素数。", "topic": "字符串", "ref": "L09 notes, section 6.", "code": ""}, {"id": "l09-16", "lesson": "L04", "src": "l09", "prompt": "What does this code print?\n\n```python\ntext = \"xyz\"\nif text.find(\"x\"):\n    print(\"yes\")\nelse:\n    print(\"no\")\n```", "options": ["`yes`", "`no`", "`0`", "An error"], "answer": 1, "exp": "`\"x\"` is at position 0, so `find` gives back `0`. In an `if`, `0` counts as **false**,\nso the code prints `no`, even though `\"x\"` is there. Always compare with `-1`:\n`if text.find(\"x\") != -1:`.\n\nRead again: L09 notes, section 6.", "zh": "find 返回索引 0，而 0 在条件判断中为假，所以输出 no。", "topic": "字符串", "ref": "L09 notes, section 6.", "code": ""}, {"id": "l09-17", "lesson": "L05", "src": "l09", "prompt": "Bubble sort runs on `[4, 2, 5, 1]`. What is the list after **one full pass**?", "options": ["`[2, 4, 1, 5]`", "`[2, 4, 5, 1]`", "`[1, 2, 4, 5]`", "`[1, 2, 5, 4]`"], "answer": 0, "exp": "Compare each pair of neighbours, from left to right:\n\n| Pair | Values | Action | The list after |\n| --- | --- | --- | --- |\n| 0 and 1 | 4 and 2 | swap | 2, 4, 5, 1 |\n| 1 and 2 | 4 and 5 | keep | 2, 4, 5, 1 |\n| 2 and 3 | 5 and 1 | swap | 2, 4, 1, 5 |\n\nB stops after one swap. C is the finished sort. D is selection sort's first pass.\n\nRead again: L09 notes, section 7.", "zh": "冒泡排序一整轮比较三对相邻元素，最终最大值 5 到达末尾。", "topic": "选择与冒泡排序", "ref": "L09 notes, section 7.", "code": ""}, {"id": "l09-18", "lesson": "L05", "src": "l09", "prompt": "Selection sort runs on `[9, 4, 7, 1, 3]`. What is the list after **one pass**?", "options": ["`[4, 7, 1, 3, 9]`", "`[4, 9, 7, 1, 3]`", "`[1, 4, 7, 9, 3]`", "`[1, 3, 4, 7, 9]`"], "answer": 2, "exp": "The smallest value is `1`, at position 3. Selection sort swaps it with the item at\nposition 0, the `9`. Nothing else moves. A is bubble sort's first pass. D is the finished\nsort.\n\nRead again: L09 notes, section 7.", "zh": "先找到最小值 1，再与索引 0 的 9 交换；其他位置不动。", "topic": "选择与冒泡排序", "ref": "L09 notes, section 7.", "code": ""}, {"id": "l09-19", "lesson": "L05", "src": "l09", "prompt": "Selection sort runs on a list of 10 items. What is the **largest** number of swaps it can\nmake?", "options": ["1", "9", "45", "100"], "answer": 1, "exp": "Selection sort makes at most one swap per pass, and there are `n - 1` passes: 9.\nThat is its one strength. Bubble sort can make up to `n(n - 1) / 2` swaps: 45.\n\nRead again: L09 notes, section 7.", "zh": "n - 1 轮，每轮至多交换一次；10 个元素至多交换 9 次。", "topic": "选择与冒泡排序", "ref": "L09 notes, section 7.", "code": ""}, {"id": "l09-20", "lesson": "L05", "src": "l09", "prompt": "`bubble_sort(numbers)` sorts the list **in place**, like the one in the L05 notes. What does\nthis code print?\n\n```python\nnumbers = [3, 1, 2]\nnumbers = bubble_sort(numbers)\nprint(numbers)\n```", "options": ["`[1, 2, 3]`", "`[3, 1, 2]`", "`[3, 2, 1]`", "`None`"], "answer": 3, "exp": "An in-place sort changes the list and gives back `None`. The second line stores that\n`None` in `numbers`, and the sorted list is lost. Call the sort alone on its line:\n`bubble_sort(numbers)`.\n\nRead again: L09 notes, section 7.", "zh": "题目引用的课程函数没有返回值，赋值会把 numbers 设成 None；原地修改本身不决定返回值。", "topic": "选择与冒泡排序", "ref": "L09 notes, section 7.", "code": "```python\ndef bubble_sort(numbers):\n    n = len(numbers)\n    for i in range(n - 1):\n        swapped = False                 # 1. the start of every pass\n        for j in range(n - 1 - i):\n            if numbers[j] > numbers[j + 1]:\n                numbers[j], numbers[j + 1] = numbers[j + 1], numbers[j]\n                swapped = True          # 2. right after the swap\n        if not swapped:                 # 3. after the pass\n            return\n```"}, {"id": "l09-21", "lesson": "L06", "src": "l09", "prompt": "Which of these sorts is **not** stable?", "options": ["Selection sort", "Bubble sort", "`sorted()`", "`.sort()`"], "answer": 0, "exp": "Selection sort swaps two items that can be far apart, so an item can jump over an\nequal one. Bubble sort only swaps two neighbours when the left one is **bigger**, so equal\nitems never pass each other. Python's `sorted()` and `.sort()` are stable.\n\nRead again: L09 notes, section 8.", "zh": "课程中的选择排序会远距离交换，可能打乱相等元素的相对顺序。", "topic": "稳定性与内置函数", "ref": "L09 notes, section 8.", "code": ""}, {"id": "l09-22", "lesson": "L06", "src": "l09", "prompt": "What does this code print?\n\n```python\nscores = [3, 1, 2]\nscores = scores.sort()\nprint(scores)\n```", "options": ["`[1, 2, 3]`", "`[3, 1, 2]`", "`None`", "An error"], "answer": 2, "exp": "`.sort()` sorts the list in place and gives back `None`, like the sorts you wrote.\nWrite `scores.sort()` alone, or `in_order = sorted(scores)`.\n\nRead again: L09 notes, section 8.", "zh": ".sort() 修改原列表并返回 None；把返回值赋给 scores 后，它就变成 None。", "topic": "稳定性与内置函数", "ref": "L09 notes, section 8.", "code": ""}, {"id": "l09-23", "lesson": "L06", "src": "l09", "prompt": "What is the time complexity of Python's `sorted()` on `n` items?", "options": ["`O(n)`", "`O(n log n)`", "`O(n²)`", "`O(log n)`"], "answer": 1, "exp": "`sorted()` and `.sort()` are `O(n log n)`, even in the worst case, and they are\nstable. Selection sort and bubble sort are `O(n²)`. On 1,000 items, that is about 10,000 steps against\nabout 500,000.\n\nRead again: L09 notes, section 8.", "zh": "按最坏情况，Python 排序是 O(n log n)，并且稳定。", "topic": "稳定性与内置函数", "ref": "L09 notes, section 8.", "code": ""}, {"id": "l09-24", "lesson": "L07", "src": "l09", "prompt": "What does this code print?\n\n```python\ndef find_index(items, target):\n    for i in range(len(items)):\n        if items[i] == target:\n            return i\n        else:\n            return -1\n\nprint(find_index([4, 9, 2], 9))\n```", "options": ["`1`", "`9`", "`None`", "`-1`"], "answer": 3, "exp": "`return -1` is **inside** the loop. At position 0, `4` is not `9`, so the `else` runs\nand the function returns `-1` at once. It never reaches position 1. `return -1` must go\n**after** the loop.\n\nRead again: L09 notes, section 9.", "zh": "第一次比较失败就进入 else 返回 -1，函数没有检查后面的 9。", "topic": "查找", "ref": "L09 notes, section 9.", "code": ""}, {"id": "l09-25", "lesson": "L07", "src": "l09", "prompt": "Linear search stops at the first match. This is the **early exit**. What does it change?", "options": ["The best case gets better. The worst case is still `O(n)`", "The worst case becomes `O(1)`", "Linear search becomes `O(log n)`", "Nothing at all"], "answer": 0, "exp": "With the early exit, a target in the first position takes 1 comparison. But a target\nin the last position, or not in the list, still takes `n`. So the search is faster in\npractice, and still `O(n)`.\n\nRead again: L09 notes, section 9.", "zh": "提前退出改善最好情况；最坏情况仍需要扫描 n 个元素。", "topic": "查找", "ref": "L09 notes, section 9.", "code": ""}, {"id": "l09-26", "lesson": "L07", "src": "l09", "prompt": "Binary search runs on `[2, 5, 8, 12, 16, 23, 38, 45, 56, 67]` and looks for `23`. How many\nvalues does it compare with `23`?", "options": ["1", "2", "3", "6"], "answer": 2, "exp": "| `low` | `high` | `mid` | `numbers[mid]` | What happens |\n| --- | --- | --- | --- | --- |\n| 0 | 9 | 4 | 16 | too small: `low = 5` |\n| 5 | 9 | 7 | 45 | too big: `high = 6` |\n| 5 | 6 | 5 | 23 | found: return `5` |\n\nLinear search would need 6 comparisons.\n\nRead again: L09 notes, section 9.", "zh": "依次查看索引 4、7、5，对应 16、45、23，一共三个值。", "topic": "查找", "ref": "L09 notes, section 9.", "code": "```python\ndef binary_search(numbers, target):\n    low = 0\n    high = len(numbers) - 1\n    while low <= high:\n        mid = (low + high) // 2\n        if numbers[mid] == target:\n            return mid\n        if numbers[mid] < target:\n            low = mid + 1                # the target is in the right half\n        else:\n            high = mid - 1               # the target is in the left half\n    return -1\n```"}, {"id": "l09-27", "lesson": "L07", "src": "l09", "prompt": "A list of 1,000,000 items is **not sorted**. You will search it only **once**. What is the\nbest choice?", "options": ["Sort it with `sorted()`, then use binary search", "Use linear search", "Use binary search at once, with no sort", "Sort it with selection sort, then use binary search"], "answer": 1, "exp": "One linear search costs at most 1,000,000 comparisons. Sorting costs about\n20,000,000 steps, more than the search it saves. C gives wrong answers on an unsorted list.\nSort once, search many: sorting first is only worth it when you search many times.\n\nRead again: L09 notes, section 9.", "zh": "只查一次时，线性扫描 O(n) 比先排序 O(n log n) 更划算。", "topic": "查找", "ref": "L09 notes, section 9.", "code": ""}, {"id": "l09-28", "lesson": "L08", "src": "l09", "prompt": "`remove_value` is the function from the L08 notes. What are the first two items of\n`numbers` after this code?\n\n```python\nnumbers = [2, 9, 2, 4]\nlength = remove_value(numbers, 2)\n```", "options": ["`2, 9`", "`4, 9`", "`2, 2`", "`9, 4`"], "answer": 3, "exp": "`fast` reads every value. Each value that is not `2` is copied to position `slow`,\nthen `slow` moves on. `9` goes to position 0 and `4` goes to position 1. `length` is `2`:\nthe answer is `numbers[0]` and `numbers[1]`. The kept values stay in their order.\n\nRead again: L09 notes, section 10.", "zh": "保留 9 和 4，依次写入索引 0、1；有效长度为 2。", "topic": "双指针", "ref": "L09 notes, section 10.", "code": "```python\ndef remove_value(numbers, unwanted):\n    slow = 0                             # where the next kept value goes\n    for fast in range(len(numbers)):\n        if numbers[fast] != unwanted:    # worth keeping?\n            numbers[slow] = numbers[fast]\n            slow = slow + 1              # one more value kept\n    return slow\n```"}, {"id": "l09-29", "lesson": "L08", "src": "l09", "prompt": "`find_pair_sorted` is the function from the L08 notes. What does this code print?\n\n```python\nprint(find_pair_sorted([1, 3, 4, 6, 9], 7))\n```", "options": ["`(1, 6)`", "`(3, 4)`", "`None`", "`(0, 3)`"], "answer": 0, "exp": "| `left` | `right` | Values | Sum | Move |\n| --- | --- | --- | --- | --- |\n| 0 | 4 | 1 + 9 | 10 | too big: `right` down |\n| 0 | 3 | 1 + 6 | 7 | found |\n\n`3 + 4` is also 7, but the walk finds `(1, 6)` first. D gives positions: the function\ngives back **values**.\n\nRead again: L09 notes, section 10.", "zh": "先看 1+9=10，右指针左移后 1+6=7，立即返回数值 (1, 6)。", "topic": "双指针", "ref": "L09 notes, section 10.", "code": "```python\ndef find_pair_sorted(numbers, target):\n    left = 0\n    right = len(numbers) - 1\n    while left < right:\n        total = numbers[left] + numbers[right]\n        if total == target:\n            return (numbers[left], numbers[right])\n        if total < target:\n            left = left + 1              # too small: a bigger left value\n        else:\n            right = right - 1            # too big: a smaller right value\n    return None\n```"}, {"id": "l09-30", "lesson": "L08", "src": "l09", "prompt": "Two pointers uses two indexes, but it is still `O(n)`, not `O(n²)`. Why?", "options": ["The pointers jump over half of the list on each turn", "The list is always sorted", "Each turn moves at least one pointer, and each pointer moves one way only", "Python runs the two pointers at the same time"], "answer": 2, "exp": "`left` only goes up and `right` only goes down. Together they cross the `n`\npositions once, so the loop runs at most `n` turns. A describes binary search, which is\n`O(log n)`.\n\nRead again: L09 notes, section 10.", "zh": "每轮至少一个指针单向前进，最多线性数量的步骤，不会为另一个指针反复重走。", "topic": "双指针", "ref": "L09 notes, section 10.", "code": ""}, {"id": "l05-01", "lesson": "L01", "src": "l05", "prompt": "Which one of these is an **algorithm**?", "options": ["Add a little salt until the soup tastes good.", "Look at each card from left to right. Stop at the first ace. If there is no ace, say \"no ace\".", "Keep guessing numbers at random until you find the right one.", "Any program written in Python."], "answer": 1, "exp": "An algorithm has steps anyone can follow **exactly**, it **always finishes**, and it is\n**correct** for every valid input. A needs judgement (\"tastes good\"). C may never finish. D is\nwrong because code is only one way to write an algorithm down, and a program can be wrong or\nnever finish.\n\nRead again: L01 notes, section 3.", "zh": "", "topic": "L05 小测", "ref": "L01 notes, section 3.", "code": ""}, {"id": "l05-02", "lesson": "L02", "src": "l05", "prompt": "Count one operation each time a line inside the function runs. The `for` line itself does not\ncount. **In the worst case**, how many operations does `count_big` do on a list of `n` numbers?\n\n```python\ndef count_big(numbers):\n    count = 0\n    for number in numbers:\n        if number > 10:\n            count = count + 1\n    return count\n```", "options": ["`n + 2`", "`2n`", "`n² + 2`", "`2n + 2`"], "answer": 3, "exp": "`count = 0` and `return count` run once each: 2. The `if` line runs once per item: `n`.\nIn the worst case every number is bigger than 10, so `count = count + 1` also runs `n` times.\nTotal: `2n + 2`. That is still `O(n)`.\n\nRead again: L02 notes, sections 2 and 4.", "zh": "", "topic": "L05 小测", "ref": "L02 notes, sections 2 and 4.", "code": ""}, {"id": "l05-03", "lesson": "L02", "src": "l05", "prompt": "What is the time complexity of `halvings_for_each`?\n\n```python\ndef halvings_for_each(numbers):\n    steps = 0\n    for number in numbers:\n        size = len(numbers)\n        while size > 1:\n            size = size // 2\n            steps = steps + 1\n    return steps\n```", "options": ["`O(log n)`", "`O(n)`", "`O(n log n)`", "`O(n²)`"], "answer": 2, "exp": "The inner `while` loop halves `size`: `log n` turns. It sits **inside** a loop over `n`\nitems, and nested loops multiply: `n × log n`.\n\nCompare: a loop over `n` items, **then** a halving loop after it, is `n + log n`, so `O(n)`.\nInside multiplies. After adds.\n\nRead again: L02 notes, sections 7 and 8.", "zh": "", "topic": "L05 小测", "ref": "L02 notes, sections 7 and 8.", "code": ""}, {"id": "l05-04", "lesson": "L02", "src": "l05", "prompt": "What is the **space** complexity of `squares`, the extra memory it uses?\n\n```python\ndef squares(numbers):\n    result = []\n    for number in numbers:\n        result.append(number * number)\n    return result\n```", "options": ["`O(1)`", "`O(n)`", "`O(log n)`", "`O(n²)`"], "answer": 1, "exp": "`result` grows by one item for each item of `numbers`, so it holds `n` items at the end.\nThe time is `O(n)` too, but time and space are two separate questions.\n\nRead again: L02 notes, section 3.", "zh": "", "topic": "L05 小测", "ref": "L02 notes, section 3.", "code": ""}, {"id": "l05-05", "lesson": "L02", "src": "l05", "prompt": "An `O(n²)` function does about 100 operations on 10 items. About how many operations does\nit do on 100 items?", "options": ["1,000", "2,000", "10,000", "100,000"], "answer": 2, "exp": "The input is 10 times bigger, and `O(n²)` squares that: `10² = 100` times more\noperations. So `100 × 100 = 10,000`. An `O(n)` function would do only 10 times more.\n\nBig-O tells you how the **work** grows, never how many seconds it takes: the seconds depend\non the computer.\n\nRead again: L02 notes, sections 1 and 7.", "zh": "", "topic": "L05 小测", "ref": "L02 notes, sections 1 and 7.", "code": ""}, {"id": "l05-06", "lesson": "L02", "src": "l05", "prompt": "What is the **worst case** of `has_negative`, and when does it happen?\n\n```python\ndef has_negative(numbers):\n    for number in numbers:\n        if number < 0:\n            return True\n    return False\n```", "options": ["`O(1)`, when the first number is negative", "`O(n)`, when the first number is negative", "`O(n²)`, when every number is negative", "`O(n)`, when no number is negative"], "answer": 3, "exp": "The loop stops at the first negative number. With no negative number, it looks at all\n`n` items, then returns `False`. A is the **best** case, not the worst.\n\nRead again: L02 notes, section 4.", "zh": "", "topic": "L05 小测", "ref": "L02 notes, section 4.", "code": ""}, {"id": "l05-07", "lesson": "L03", "src": "l05", "prompt": "What is the time complexity of `total_of_rests`?\n\n```python\ndef total_of_rests(numbers):\n    total = 0\n    for i in range(len(numbers)):\n        rest = numbers[i:]\n        total = total + len(rest)\n    return total\n```", "options": ["`O(1)`", "`O(n)`", "`O(n log n)`", "`O(n²)`"], "answer": 3, "exp": "It looks like one loop, but `numbers[i:]` is a **slice**, and a slice copies its items.\nThe slices copy `n`, then `n - 1`, and so on down to 1 item: about `n² / 2` copies in total.\n\nRead again: L03 notes, section 4, and L04 notes, section 6.", "zh": "", "topic": "L05 小测", "ref": "L03 notes, section 4, and L04 notes, section 6.", "code": ""}, {"id": "l05-08", "lesson": "L03", "src": "l05", "prompt": "What does this code print?\n\n```python\nmarks = [4, 7, 9]\nfor mark in marks:\n    mark = mark + 1\nprint(marks)\n```", "options": ["`[4, 7, 9]`", "`[5, 8, 10]`", "`[5, 7, 9]`", "`None`"], "answer": 0, "exp": "`mark = mark + 1` changes the name `mark`, not the list. A loop over items cannot change\nthe list. To change it, loop over the positions: `marks[i] = marks[i] + 1`.\n\nRead again: L03 notes, section 6.", "zh": "", "topic": "L05 小测", "ref": "L03 notes, section 6.", "code": ""}, {"id": "l05-09", "lesson": "L03", "src": "l05", "prompt": "What does this code print?\n\n```python\na = [3, 1, 2]\nb = a[:]\nb.append(4)\nprint(a, b)\n```", "options": ["`[3, 1, 2, 4] [3, 1, 2, 4]`", "`[3, 1, 2] [3, 1, 2, 4]`", "`[3, 1, 2] None`", "`[3, 1, 2, 4] [3, 1, 2]`"], "answer": 1, "exp": "`a[:]` is a full slice, so `b` is a **new** list, a copy. Changing `b` does not change\n`a`. With `b = a` instead, both names would show `[3, 1, 2, 4]`: one list, two names.\n\nRead again: L03 notes, sections 4 and 6.", "zh": "", "topic": "L05 小测", "ref": "L03 notes, sections 4 and 6.", "code": ""}, {"id": "l05-10", "lesson": "L04", "src": "l05", "prompt": "What does this code print?\n\n```python\nprint(chr(ord(\"a\") + 2))\n```", "options": ["`c`", "`b`", "`99`", "A `TypeError`"], "answer": 0, "exp": "Read it from the inside out. First `ord(\"a\")`: 97. Then `+ 2`: 99. Then `chr(99)`, the\ncharacter for 99, which is `c`. The letters follow each other with no gaps, so you can do arithmetic with them.\n\nRead again: L04 notes, section 5.", "zh": "", "topic": "L05 小测", "ref": "L04 notes, section 5.", "code": ""}, {"id": "l05-11", "lesson": "L04", "src": "l05", "prompt": "What does this code print?\n\n```python\nparts = \"2026-11-07\".split(\"-\")\nprint(len(parts), parts[1])\n```", "options": ["`3 11`", "`2 11`", "`3 -`", "`10 11`"], "answer": 0, "exp": "`split(\"-\")` cuts the string at each `-` and gives back a **list** of 3 strings:\n`[\"2026\", \"11\", \"07\"]`. Position 1 is `\"11\"`. The `-` signs are not in the list.\n\nRead again: L04 notes, section 4.", "zh": "", "topic": "L05 小测", "ref": "L04 notes, section 4.", "code": ""}, {"id": "l05-12", "lesson": "L04", "src": "l05", "prompt": "`text` holds `n` characters. Which one of these is `O(1)`?", "options": ["`text.upper()`", "`\"x\" in text`", "`text[5]`", "`text.replace(\"a\", \"b\")`"], "answer": 2, "exp": "Reading one position is `O(1)`, as on a list. The others read the whole string, and\n`upper` and `replace` also build a new one: `O(n)`.\n\nRead again: L04 notes, \"What each operation costs\".", "zh": "", "topic": "L05 小测", "ref": "L04 notes, \"What each operation costs\".", "code": ""}, {"id": "ai-l01-01", "lesson": "L01", "src": "ai", "prompt": "Which of these is **not** required of an algorithm?", "options": ["It always finishes", "It is correct for every valid input", "It is written in Python", "Anyone can follow every step exactly"], "answer": 2, "exp": "", "zh": "算法不等于代码。Python 只是写下算法的一种方式，也可以用英文或流程图。", "topic": "算法的定义", "ref": "L01 notes", "code": ""}, {"id": "ai-l01-02", "lesson": "L01", "src": "ai", "prompt": "A student runs their method on one example and gets the right answer. What can you conclude?", "options": ["It is correct for every input", "It is correct for that example only", "It must be fast", "It is a data structure"], "answer": 1, "exp": "", "zh": "一个例子成立不代表对所有合法输入都正确。", "topic": "正确性", "ref": "L01 notes", "code": ""}, {"id": "ai-l01-03", "lesson": "L01", "src": "ai", "prompt": "I think of a number between 1 and 1,000,000,000. You halve the range with each guess. In the worst case, about how many guesses?", "options": ["10", "20", "30", "1,000"], "answer": 2, "exp": "", "zh": "2^30 约为 10 亿，所以约 30 次。每多一倍范围只多一次猜测。", "topic": "对半查找", "ref": "L01 notes", "code": ""}, {"id": "ai-l02-01", "lesson": "L02", "src": "ai", "prompt": "Count one operation per line run inside the function (the `for` line does not count). How many operations on a list of `n` numbers?\n\n```python\ndef add_all(numbers):\n    total = 0\n    for x in numbers:\n        total = total + x\n    return total\n```", "options": ["n", "n + 2", "2n + 2", "n²"], "answer": 1, "exp": "", "zh": "total = 0 一次，循环体 n 次，return 一次，共 n + 2。", "topic": "操作计数", "ref": "L02 notes", "code": ""}, {"id": "ai-l02-02", "lesson": "L02", "src": "ai", "prompt": "What is the time complexity?\n\n```python\ndef f(numbers):\n    count = 0\n    for x in numbers:\n        for k in range(5):\n            count = count + 1\n    return count\n```", "options": ["O(1)", "O(n)", "O(n²)", "O(5n²)"], "answer": 1, "exp": "", "zh": "内层固定 5 次，总轮数 5n，所以是 O(n)。要数轮数，不要数页面上的循环个数。", "topic": "数轮数", "ref": "L02 notes", "code": ""}, {"id": "ai-l02-03", "lesson": "L02", "src": "ai", "prompt": "An `O(n²)` function takes 2 seconds for 1,000 items. About how long for 2,000 items?", "options": ["4 seconds", "8 seconds", "2 seconds", "16 seconds"], "answer": 1, "exp": "", "zh": "n 翻倍，O(n²) 工作量变为 4 倍：2 × 4 = 8 秒。", "topic": "增长倍数", "ref": "L02 notes", "code": ""}, {"id": "ai-l02-04", "lesson": "L02", "src": "ai", "prompt": "What is the time complexity?\n\n```python\ndef g(n):\n    for i in range(n):\n        j = 1\n        while j < n:\n            j = j * 2\n```", "options": ["O(log n)", "O(n)", "O(n log n)", "O(n²)"], "answer": 2, "exp": "", "zh": "内层 j 每次翻倍，约 log n 轮；外层 n 次，相乘得 n log n。", "topic": "嵌套对数循环", "ref": "L02 notes", "code": ""}, {"id": "ai-l02-05", "lesson": "L02", "src": "ai", "prompt": "What is the **extra space** complexity?\n\n```python\ndef size_of_copy(numbers):\n    copy = numbers[:]\n    return len(copy)\n```", "options": ["O(1)", "O(log n)", "O(n)", "O(n²)"], "answer": 2, "exp": "", "zh": "numbers[:] 复制 n 个元素，额外空间 O(n)。输入本身不计入。", "topic": "空间复杂度", "ref": "L02 notes", "code": ""}, {"id": "ai-l03-01", "lesson": "L03", "src": "ai", "prompt": "What does this print?\n\n```python\na = [1, 2, 3]\nb = a\nb[0] = 9\nprint(a)\n```", "options": ["[1, 2, 3]", "[9, 2, 3]", "[9]", "Error"], "answer": 1, "exp": "", "zh": "b = a 没有复制，只是同一个列表的第二个名字。", "topic": "别名", "ref": "L03 notes", "code": ""}, {"id": "ai-l03-02", "lesson": "L03", "src": "ai", "prompt": "`insert(0, x)` is called `n` times in a loop to build a list. What is the total time?", "options": ["O(1)", "O(n)", "O(n log n)", "O(n²)"], "answer": 3, "exp": "", "zh": "每次 insert(0, x) 要移动全部元素，O(n)，重复 n 次得 O(n²)。", "topic": "操作成本", "ref": "L03 notes", "code": ""}, {"id": "ai-l03-03", "lesson": "L03", "src": "ai", "prompt": "What does this print?\n\n```python\nnums = [5, 6, 7]\nfirst = nums.pop(0)\nprint(first, nums)\n```", "options": ["5 [6, 7]", "5 [5, 6, 7]", "7 [5, 6]", "None [6, 7]"], "answer": 0, "exp": "", "zh": "pop(0) 删除并返回第一个元素 5，列表剩下 [6, 7]。", "topic": "pop 的返回值", "ref": "L03 notes", "code": ""}, {"id": "ai-l03-04", "lesson": "L03", "src": "ai", "prompt": "What does this print?\n\n```python\nx = [1, 2]\ny = x.append(3)\nprint(y)\n```", "options": ["[1, 2, 3]", "3", "None", "Error"], "answer": 2, "exp": "", "zh": "append 修改列表但返回 None。", "topic": "append 返回 None", "ref": "L03 notes", "code": ""}, {"id": "ai-l03-05", "lesson": "L03", "src": "ai", "prompt": "An array starts at address 1000 and each item takes 4 cells. At what address is position 6?", "options": ["1006", "1024", "1004", "1028"], "answer": 1, "exp": "", "zh": "1000 + 6 × 4 = 1024。", "topic": "地址计算", "ref": "L03 notes", "code": ""}, {"id": "ai-l03-06", "lesson": "L03", "src": "ai", "prompt": "What does this print?\n\n```python\ndef add_one(items):\n    items.append(1)\n\nlst = [0]\nadd_one(lst)\nprint(lst)\n```", "options": ["[0]", "[1]", "[0, 1]", "None"], "answer": 2, "exp": "", "zh": "参数是同一个列表的第二个名字，函数里的 append 会改动原列表。", "topic": "函数参数是别名", "ref": "L03 notes", "code": ""}, {"id": "ai-l04-01", "lesson": "L04", "src": "ai", "prompt": "What happens?\n\n```python\nword = \"cat\"\nword[0] = \"b\"\n```", "options": ["word becomes \"bat\"", "TypeError", "IndexError", "Nothing happens"], "answer": 1, "exp": "", "zh": "字符串不可变，不能改单个字符，会报 TypeError。", "topic": "字符串不可变", "ref": "L04 notes", "code": ""}, {"id": "ai-l04-02", "lesson": "L04", "src": "ai", "prompt": "What does this print?\n\n```python\ns = \"hi\"\ns.upper()\nprint(s)\n```", "options": ["HI", "hi", "None", "Error"], "answer": 1, "exp": "", "zh": "字符串方法返回新串，且这里没有保存，所以 s 不变。", "topic": "方法不修改原串", "ref": "L04 notes", "code": ""}, {"id": "ai-l04-03", "lesson": "L04", "src": "ai", "prompt": "What does this print?\n\n```python\nprint(\"-\".join([\"a\", \"b\", \"c\"]))\n```", "options": ["-a-b-c-", "a-b-c", "abc", "a - b - c"], "answer": 1, "exp": "", "zh": "分隔符只出现在元素之间，不在两端。", "topic": "join 位置", "ref": "L04 notes", "code": ""}, {"id": "ai-l04-04", "lesson": "L04", "src": "ai", "prompt": "`text = \"xyz\"`. What does `if text.find(\"x\"):` do?", "options": ["Runs the body, because x is found", "Does not run the body, because find returns 0", "Raises an error", "Runs the body, because 0 is true"], "answer": 1, "exp": "", "zh": "find 返回 0，0 视为假，所以不执行。应写 != -1。", "topic": "find 与 if", "ref": "L04 notes", "code": ""}, {"id": "ai-l04-05", "lesson": "L04", "src": "ai", "prompt": "Building a string of `n` characters by `+` inside a loop costs:", "options": ["O(1)", "O(n)", "O(n log n)", "O(n²)"], "answer": 3, "exp": "", "zh": "每次 + 都复制已有内容，总复制约 n²/2。", "topic": "用 + 拼接成本", "ref": "L04 notes", "code": ""}, {"id": "ai-l04-06", "lesson": "L04", "src": "ai", "prompt": "What does this print?\n\n```python\nprint(len(\"a b  c\".split()))\n```", "options": ["3", "4", "5", "6"], "answer": 0, "exp": "", "zh": "split() 不带参数，按任意连续空白切分，得到 3 个词。", "topic": "split", "ref": "L04 notes", "code": ""}, {"id": "ai-l05-01", "lesson": "L05", "src": "ai", "prompt": "Selection sort on `[3, 1, 2]`. What is the list after **one pass**?", "options": ["[1, 3, 2]", "[1, 2, 3]", "[3, 1, 2]", "[2, 1, 3]"], "answer": 0, "exp": "", "zh": "最小值 1 在位置 1，与位置 0 交换，得 [1, 3, 2]。", "topic": "一轮选择排序", "ref": "L05 notes", "code": ""}, {"id": "ai-l05-02", "lesson": "L05", "src": "ai", "prompt": "Bubble sort on `[3, 1, 2]`. What is the list after **one pass**?", "options": ["[1, 2, 3]", "[1, 3, 2]", "[3, 1, 2]", "[2, 1, 3]"], "answer": 0, "exp": "", "zh": "[3,1,2] → 比较(3,1)交换 → [1,3,2] → 比较(3,2)交换 → [1,2,3]。最大值 3 一轮就沉到末尾。对比：选择排序一轮后是 [1,3,2]。", "topic": "一轮冒泡", "ref": "L05 notes", "code": ""}, {"id": "ai-l05-03", "les <script>(function(){ const {P,H,LI,C,T,W,X,K,D,S} = RV;

 lead:'两个排序都是 O(n²)，考试问的是：推演一轮后列表长什么样、比较和交换各多少次、冒泡的提前退出。下面的演示台可以直接看。',

   T(['轮','未排序部分里的最小值','交换','这一轮后'],[['1','`2`，在位置 3','位置 0 和 3','`[2, 3, 9, 7]`'],['2','`3`，在位置 1','不用换，已在位','`[2, 3, 9, 7]`'],['3','`7`，在位置 3','位置 2 和 3','`[2, 3, 7, 9]`']],'对 [7, 3, 9, 2] 的推演。一轮 = 一次扫描 + 至多一次交换'),
   D('select','选择排序：黄色是正在比较，粉色是交换，青色是已排好'),

// ---- Python syntax highlighting (tokenised on raw text, then escaped) ----
const KW = new Set('def return for in if else elif while and or not import from break continue pass'.split(' '));
const CONST = new Set(['True','False','None']);
const BI = new Set('print range len sorted min max sum list str int abs'.split(' '));
function highlight(code){
  const re = /(#[^\n]*)|("[^"\n]*"|'[^'\n]*')|\b(\d+)\b|\b([A-Za-z_]\w*)\b(\s*\()?/g;
  let out = '', last = 0, m;
  while((m = re.exec(code))){
    out += esc(code.slice(last, m.index)); last = re.lastIndex;
    if(m[1]) out += `<span class="k-cm">${esc(m[1])}</span>`;
    else if(m[2]) out += `<span class="k-str">${esc(m[2])}</span>`;
    else if(m[3]) out += `<span class="k-num">${m[3]}</span>`;
    else { const w = m[4], call = m[5] || '';
      if(KW.has(w)) out += `<span class="k-kw">${w}</span>${call}`;
      else if(CONST.has(w)) out += `<span class="k-num">${w}</span>${call}`;
      else if(BI.has(w)) out += `<span class="k-bi">${w}</span>${call}`;
      else if(call) out += `<span class="k-fn">${w}</span>${call}`;
      else out += w; }
  }
  return out + esc(code.slice(last));
}
// minimal markdown: ```code``` blocks, `inline`, **bold**
function md(s){
  const parts = s.split(/```(?:python)?\n?/);
  return parts.map((p,i) => i%2 ? '<pre><code>'+highlight(p.replace(/\n$/,''))+'</code></pre>'
    : esc(p).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')).join('');
}

// ---- algorithm stage: four step-able visual demos ----
const DEMOS = {
 bubble:{name:'冒泡排序', data:[5,1,4,2,8,3,7,6], *run(a, ev){
   const n=a.length; let c=0,s=0;
   for(let i=0;i<n-1;i++){ let sw=false;
     for(let j=0;j<n-1-i;j++){ c++; yield ev({cmp:[j,j+1],ptr:{j:j},c,s,say:`比较 a[${j}]=${a[j]} 与 a[${j+1}]=${a[j+1]}`});
       if(a[j]>a[j+1]){ [a[j],a[j+1]]=[a[j+1],a[j]]; s++; sw=true; yield ev({swp:[j,j+1],ptr:{j:j},c,s,say:'左边更大，交换'}); } }
     yield ev({done:range(n-1-i,n),c,s,say:`第 ${i+1} 轮结束，最大值沉到末尾`}); if(!sw){ yield ev({done:range(0,n),c,s,say:'这一轮没有交换，说明已经有序，提前退出'}); return; } }
   yield ev({done:range(0,n),c,s,say:'排序完成'}); }},
 select:{name:'选择排序', data:[6,3,8,2,7,4,5,1], *run(a, ev){
   const n=a.length; let c=0,s=0;
   for(let i=0;i<n-1;i++){ let m=i;
     for(let j=i+1;j<n;j++){ c++; yield ev({cmp:[m,j],ptr:{i:i,m:m,j:j},done:range(0,i),c,s,say:`扫描 a[${j}]=${a[j]}，目前最小值 a[${m}]=${a[m]}`}); if(a[j]<a[m]) m=j; }
     if(m!==i){ [a[i],a[m]]=[a[m],a[i]]; s++; yield ev({swp:[i,m],ptr:{i:i},done:range(0,i),c,s,say:`把最小值换到位置 ${i}`}); }
     else yield ev({ptr:{i:i},done:range(0,i+1),c,s,say:`位置 ${i} 已经是最小值，不用交换`}); }
   yield ev({done:range(0,n),c,s,say:'排序完成。交换最多 n-1 次'}); }},
 binary:{name:'二分查找', data:[2,5,8,12,16,23,38,45,56,67], target:56, *run(a, ev, t){
   let lo=0,hi=a.length-1,c=0;
   while(lo<=hi){ const mid=(lo+hi)>>1; c++;
     yield ev({cmp:[mid],ptr:{low:lo,mid:mid,high:hi},fade:[0,lo,hi+1,a.length],c,s:0,say:`mid=${mid}，a[mid]=${a[mid]}，目标 ${t}`});
     if(a[mid]===t){ yield ev({hit:[mid],c,s:0,say:`找到了，位置 ${mid}，共比较 ${c} 次`}); return; }
     if(a[mid]<t){ lo=mid+1; } else { hi=mid-1; } }
   yield ev({c,s:0,say:'返回 -1'}); }},
 pair:{name:'双指针求和', data:[1,2,3,5,6,8,9,11], target:15, *run(a, ev, t){
   let l=0,r=a.length-1,c=0;
   while(l<r){ const sum=a[l]+a[r]; c++;
     yield ev({cmp:[l,r],ptr:{left:l,right:r},fade:[0,l,r+1,a.length],c,s:0,say:`${a[l]} + ${a[r]} = ${sum}，目标 ${t}`});
     if(sum===t){ yield ev({hit:[l,r],c,s:0,say:`找到 (${a[l]}, ${a[r]})，共 ${c} 步`}); return; }
     if(sum<t){ l++; } else { r--; } }
   yield ev({c,s:0,say:'没有这样的数对，返回 None'}); }}
};
function range(a,b){ const o=[]; for(let i=a;i<b;i++) o.push(i); return o; }
let stage = null;
function stageLoad(key){
  const d = DEMOS[key]; const arr = d.data.slice();
  const frames = []; const snap = o => { frames.push(Object.assign({arr:arr.slice()}, o)); return 0; };
  const it = d.run(arr, snap, d.target); while(!it.next().done){}
  stage = {key, frames, i:0, playing:true, timer:null, base:d.data.slice(), target:d.target};
  stageDraw(); stagePlay();
}
function stageDraw(){
  const box = $('#plot'); if(!box || !stage) return; const f = stage.frames[stage.i] || {arr:stage.base};
  const mx = Math.max(...stage.base);
  const has = (k,i) => f[k] && f[k].includes(i);
  const ptr = {}; Object.entries(f.ptr||{}).forEach(([k,v]) => { (ptr[v] = ptr[v] || []).push(k); });
  box.innerHTML = f.arr.map((v,i) => {
    const cls = [has('swp',i)?'swp':'', has('cmp',i)&&!has('swp',i)?'cmp':'', has('hit',i)?'hit':'', has('done',i)?'ok':'',
      f.fade && (i<f.fade[1]||i>=f.fade[2]) ? 'dim':''].join(' ');
    return `<i class="${cls}" style="height:${v/mx*100}%"><b>${v}</b>${ptr[i]?`<u>${ptr[i].join(' · ')}</u>`:''}</i>`; }).join('');
  $('#readout').innerHTML = `<span>步骤 <b>${stage.i+1}</b>/${stage.frames.length}</span><span>比较 <b>${f.c||0}</b></span>${stage.key==='bubble'||stage.key==='select'?`<span>交换 <b>${f.s||0}</b></span>`:''}${stage.target!==undefined?`<span>目标 <b>${stage.target}</b></span>`:''}<span class="say">${f.say||''}</span>`;
  const p = $('#pp'); if(p) p.innerHTML = stage.playing ? '<svg viewBox="0 0 16 16"><path d="M4 2h3v12H4zM9 2h3v12H9z"/></svg>' : '<svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg>';
}
function stagePlay(){
  clearInterval(stage.timer); if(!stage.playing || reduceMotion()) { stage.playing = stage.playing && !reduceMotion(); stageDraw(); return; }
  stage.timer = setInterval(() => { if(!$('#plot')){ clearInterval(stage.timer); return; }
    if(stage.i < stage.frames.length-1){ stage.i++; stageDraw(); }
    else { stage.playing = false; clearInterval(stage.timer); stageDraw(); } }, 620);
}
function stageStep(d){ if(!stage) return; stage.playing = false; clearInterval(stage.timer); stage.i = Math.max(0, Math.min(stage.frames.length-1, stage.i+d)); stageDraw(); }
function stageToggle(){ if(!stage) return; if(!stage.playing){ if(stage.i>=stage.frames.length-1) stage.i=0; stage.playing = true; stagePlay(); } else { stage.playing = false; clearInterval(stage.timer); } stageDraw(); }

function record(q, ok, redo){
  const mcq1 = Boolean(byId[q.id]);
  const attempts = mcq1 ? S.att : (S.practiceAtt ||= {});
  const a = attempts[q.id] || (attempts[q.id] = {r:0,w:0});
  ok ? a.r++ : a.w++; a.last = ok; a.t = Date.now();
  const filedMistake = mcq1 && !ok;
  if(filedMistake){ S.mistakes[q.id] = {t:Date.now()}; }
  else if(ok && redo && S.mistakes[q.id]){ delete S.mistakes[q.id]; }
  save();
  return filedMistake;
}

function runQuiz(list, opt){
  let i = 0, combo = 0, best = 0, right = 0, gained = 0, filedMistakes = 0;
  const marks = list.map(()=>'');
  const exit = () => opt.back ? go('review',{l:opt.back.l}) : opt.redo ? go('mistakes') : go('practice',ctx);

    $('#app').innerHTML = `<div class="qwrap" style="--lc:${col}">
    <div class="qtop"><button class="xbtn" id="qx">退出</button><span class="qtitle">${opt.title}</span><span class="sp"></span><span class="combo ${combo>=2?'hot':''}">连击 <b>×${combo}</b></span></div>
    <div class="segs">${list.map((_,k)=>`<i class="${k===i?'cur':marks[k]}"></i>`).join('')}</div>
    <article class="qcard"><div class="qh"><span class="qno">${pad(i+1)}<small> / ${pad(list.length)}</small></span><span class="qtags">${pill(q)}</span><button class="star ${S.star[q.id]?'on':''}" id="st" aria-label="标记这道题" aria-pressed="${!!S.star[q.id]}">${STAR}</button></div>
    <div class="qtopic">${q.topic}</div><div class="prompt">${md(q.prompt)}</div>${refCode(q)}
    <div class="opts">${q.options.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span class="ot">${md(o)}</span><span class="mk"></span></button>`).join('')}</div>
    <div id="fb"></div>
    <div class="qf"><span class="kbd"><kbd>1</kbd>–<kbd>4</kbd> 选择 <kbd>Enter</kbd> 下一题</span><span class="sp"></span><button class="btn" id="nx" disabled>${i+1===list.length?'完成':'下一题'}</button></div></article></div>`;
    $('#qx').onclick = exit;
    $('#st').onclick = () => { S.star[q.id] ? delete S.star[q.id] : S.star[q.id]=true; save(); $('#st').classList.toggle('on', !!S.star[q.id]); $('#st').setAttribute('aria-pressed', !!S.star[q.id]); };
    const choose = k => {
      if(picked!==null || k>=q.options.length) return; picked = k; const ok = k===q.answer; let gain = 0;
      document.querySelectorAll('.opt').forEach((x,n) => { x.disabled = true; if(n===q.answer) x.classList.add('right'); else if(n===k) x.classList.add('wrong'); });
      const filedMistake = record(q, ok, opt.redo);
      marks[i] = ok ? 'r' : 'w';

function radar(vals){
  const n = vals.length, cx = 150, cy = 150, R = 110, pt = (i,r) => { const a = -Math.PI/2 + i*2*Math.PI/n; return [cx+Math.cos(a)*R*r, cy+Math.sin(a)*R*r]; };
  const ring = r => vals.map((_,i)=>pt(i,r).join(',')).join(' ');
  const shape = vals.map((v,i)=>pt(i,Math.max(.04,v.v/100)).join(',')).join(' ');
  return `<svg class="radar" viewBox="0 0 300 300" role="img" aria-label="各课正确率雷达图">
  <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ef2d6" stop-opacity=".55"/><stop offset="1" stop-color="#8f7bff" stop-opacity=".55"/></linearGradient></defs>
  ${[.25,.5,.75,1].map(r=>`<polygon points="${ring(r)}" fill="none" stroke="rgba(143,150,255,.2)"/>`).join('')}
  ${vals.map((_,i)=>`<line x1="${cx}" y1="${cy}" x2="${pt(i,1)[0]}" y2="${pt(i,1)[1]}" stroke="rgba(143,150,255,.14)"/>`).join('')}
  <polygon points="${shape}" fill="url(#rg)" stroke="#2ef2d6" stroke-width="2" stroke-linejoin="round"/>
  ${vals.map((v,i)=>{const p=pt(i,Math.max(.04,v.v/100)),t=pt(i,1.2);return `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${LCOL[v.id]}"/><text x="${t[0]}" y="${t[1]}" fill="#8a90bd" font-size="12" font-family="ui-monospace,Menlo,monospace" text-anchor="middle" dominant-baseline="middle">${v.id}</text>`}).join('')}</svg>`;
}

// each embedded demo gets its own tiny player (paused at step 1 until pressed)
function rvMountDemos(){
  document.querySelectorAll('.demo').forEach(root => {
    const key = root.dataset.demo, d = DEMOS[key], arr = d.data.slice(), frames = [];
    const it = d.run(arr, o => { frames.push(Object.assign({arr:arr.slice()}, o)); return 0; }, d.target); while(!it.next().done){}
    const st = {i:0, playing:false, timer:null}, mx = Math.max(...d.data);
    const plot = root.querySelector('.plot'), ro = root.querySelector('.readout'), pp = root.querySelector('[data-a=pp]');
    const draw = () => {
      const f = frames[st.i], has = (k,i) => f[k] && f[k].includes(i), ptr = {};
      Object.entries(f.ptr||{}).forEach(([k,v]) => { (ptr[v] = ptr[v] || []).push(k); });
      plot.innerHTML = f.arr.map((v,i) => { const cls = [has('swp',i)?'swp':'', has('cmp',i)&&!has('swp',i)?'cmp':'', has('hit',i)?'hit':'', has('done',i)?'ok':'', f.fade&&(i<f.fade[1]||i>=f.fade[2])?'dim':''].join(' ');
        return `<i class="${cls}" style="height:${v/mx*100}%"><b>${v}</b>${ptr[i]?`<u>${ptr[i].join(' · ')}</u>`:''}</i>`; }).join('');
      ro.innerHTML = `<span>步骤 <b>${st.i+1}</b>/${frames.length}</span><span>比较 <b>${f.c||0}</b></span>${key==='bubble'||key==='select'?`<span>交换 <b>${f.s||0}</b></span>`:''}${d.target!==undefined?`<span>目标 <b>${d.target}</b></span>`:''}<span class="say">${f.say||''}</span>`;
      pp.innerHTML = st.playing ? '<svg viewBox="0 0 16 16"><path d="M4 2h3v12H4zM9 2h3v12H9z"/></svg>' : '<svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg>';
    };
    const stop = () => { st.playing = false; clearInterval(st.timer); };
    const play = () => { if(st.i>=frames.length-1) st.i = 0; st.playing = true; clearInterval(st.timer);
      if(reduceMotion()){ st.playing = false; return; }
      st.timer = setInterval(() => { if(!document.body.contains(root)){ clearInterval(st.timer); return; } if(st.i<frames.length-1){ st.i++; draw(); } else { stop(); draw(); } }, 620); };
    root.querySelector('[data-a=pv]').onclick = () => { stop(); st.i = Math.max(0, st.i-1); draw(); };
    root.querySelector('[data-a=nx]').onclick = () => { stop(); st.i = Math.min(frames.length-1, st.i+1); draw(); };
    root.querySelector('[data-a=rs]').onclick = () => { stop(); st.i = 0; draw(); play(); draw(); };
    pp.onclick = () => { if(st.playing) stop(); else play(); draw(); };
    draw();
  });
}

const rankApi = 'https://dsa-dojo-rank.awake-lily-0010.chatgpt.site';
let rankTimer, rankRequest = 0;
async function rankFetch(path, body) {
  const controller = typeof AbortController === 'function' ? new AbortController() : null;
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => {
      reject(new Error('排行榜服务响应超时。'));
      controller?.abort();
    },12000);
  });
  async function send() {
    let response;
    try {
      response = await fetch(rankApi+path, {
        method:body ? 'POST' : 'GET', body:body ? JSON.stringify(body) : undefined,
        credentials:'omit', cache:'no-store', signal:controller?.signal
      });
    } catch { throw new Error('当前浏览器未能连接到排行榜服务。'); }
    if (!response.ok) throw new Error('排行榜服务返回 HTTP '+response.status+'。');
    try { return await response.json(); }
    catch { throw new Error('排行榜服务返回了无法读取的数据。'); }
  }
  try { return await Promise.race([send(),timeout]); }
  finally { clearTimeout(timer); }
}
async function syncRank(force = false) {
  return rankLock(async () => {
    const p = readPlayer();
    if (!p) return;
    const xp = Math.max(S.xp, JSON.parse(localStorage.getItem(KEY) || '{}').xp || 0);
    if (!force && p.id && p.synced >= xp) return;
    const row = await rankFetch('/sync',{key:p.key,nickname:p.nickname,xp});
    if (!Number.isInteger(row.id) || !Number.isSafeInteger(row.xp)) throw new Error('同步失败');
    if (readPlayer()?.key === p.key) storePlayer({...p,id:row.id,synced:row.xp});
    return true;
  });
}
function scheduleRankSync() {
  clearTimeout(rankTimer);
  rankTimer = setTimeout(() => syncRank().catch(() => {}),600);
}
async function resetPlayer() {
  clearTimeout(rankTimer);
  try {
    await rankLock(async () => {
      const p = readPlayer();
      if (p) await rankFetch('/remove',{key:p.key});
      localStorage.removeItem(playerKey);
      localStorage.removeItem(KEY);
    });
    location.reload();
  } catch {toast('未能移除排名，请联网后重试。');}
}
function startPlayer() {
  const p = readPlayer();
  if (p && validName(p.nickname)) {
    document.body.classList.remove('enrolling');
    hud(); go('home'); scheduleRankSync();
    return;
  }
  location.replace('welcome.html?next=study');
}
function recoverRanking() {
  if (document.hidden || !readPlayer()) return;
  if (tab==='ranking' && ($('#retry-rank') || $('#rank-pending'))) VIEWS.ranking();
  else scheduleRankSync();
}
window.addEventListener('online',recoverRanking);
document.addEventListener('visibilitychange',recoverRanking);
function refreshLocalProgress() {
  const latest = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (!latest) return;
  if (S.rv && latest.rv) Object.assign(S.rv,latest.rv);
  S = {...latest,rv:S.rv || latest.rv};
  if (readPlayer()) hud();
}
window.addEventListener('pageshow', e => { if (e.persisted) { refreshLocalProgress(); recoverRanking(); } });
window.addEventListener('storage', e => {
  if (e.key === KEY && e.newValue) refreshLocalProgress();
  if (e.key === playerKey && (!e.newValue || !e.oldValue)) location.reload();
});
setInterval(recoverRanking,30000);
VIEWS.ranking = async function(){
  const request = ++rankRequest, page = ctx.page || 1, p = readPlayer();
  const title = '<header class="rank-cover"><div><div class="register-label">DSA · 经验名册</div><h1>排行榜</h1><p>按累计经验排列，同分并列。</p></div></header>';
  $('#app').innerHTML = title+'<section class="rank-paper" id="rankbody" aria-live="polite">正在读取全站排名…</section>';
  const active = () => tab==='ranking' && request===rankRequest;
  const board = () => rankFetch('/board?page='+page+'&player='+(readPlayer()?.id || 0));
  const sync = syncRank().then(changed => ({changed}), () => ({pending:true}));
  function render(data, pending) {
    if (!active()) return;
    const me = data.mine;
    const fmt = n=>Number(n).toLocaleString('zh-CN');
    const rows = data.rows.map(row => `<tr class="${row.id===me?.id?'rank-me':''}"><td>${fmt(row.place)}</td><th scope="row">${esc(row.nickname)}${row.id===me?.id?' <small>我</small>':''}</th><td>Lv. ${Math.floor(Math.sqrt(row.xp/20))+1}</td><td>${fmt(row.xp)}</td></tr>`).join('');
    $('#rankbody').innerHTML = `<div class="my-standing"><div><small>我的名次</small><strong>${me?'第 '+fmt(me.place)+' 名':'等待同步'}</strong></div><div><small>玩家</small><b>${esc(p.nickname)}</b></div><div><small>累计经验</small><b>${fmt(me?.xp ?? S.xp)} XP</b></div></div>
    ${pending ? '<p id="rank-pending" role="status">排名更新中，以下为最近读取的结果。</p>' : ''}
    <div class="rank-toolbar"><h2>全站名册 <small>${fmt(data.total)} 位玩家</small></h2><button id="rank-refresh">刷新</button></div>
    <table class="rank-table"><thead><tr><th>名次</th><th>昵称</th><th>等级</th><th>经验值</th></tr></thead><tbody>${rows}</tbody></table>
    ${data.total>50 || page>1 ? '<div class="rank-pager"><button id="prev-rank" '+(page===1?'disabled':'')+'>上一页</button><span>第 '+page+' 页</span><button id="next-rank" '+(page*50>=data.total?'disabled':'')+'>下一页</button></div>':''}`;
    $('#rank-refresh').onclick = () => go('ranking',{page});
    if ($('#prev-rank')) $('#prev-rank').onclick = () => go('ranking',{page:page-1});
    if ($('#next-rank')) $('#next-rank').onclick = () => go('ranking',{page:page+1});
  }
  try {
    const data = await board();
    if (!active()) return;
    const dirty = !p.id || p.synced < S.xp;
    render(data, dirty);
    const result = await sync;
    if (!active()) return;
    let changed = result.changed;
    if (!changed && !result.pending && !data.mine && readPlayer()?.id) {
      try { changed = await syncRank(true); }
      catch { render(data,true); return; }
    }
    if (changed) {
      try { render(await board(),false); }
      catch { render(data,true); }
    } else render(data,result.pending);
  } catch (error) {
    if (active()) {
      $('#rankbody').innerHTML='<p id="rank-error"></p><p>提示：请使用特殊的网络连接</p><p>学习记录保存在本机。此页会自动重试；若持续失败，可在当前浏览器切换 Wi-Fi 或移动数据后重试。</p><button id="retry-rank">重试</button>';
      $('#rank-error').textContent = error.message || '暂时无法读取全站排名。';
      $('#retry-rank').onclick = () => go('ranking',{page});
    }
  }
};
